begin khronos

  begin egl display 1
    egl-dlls = iris_dri.so EGL-mesa.so
    glesv2-dlls = iris_dri.so GLESv2-mesa.so
    gpu-dlls = iris_dri.so gpu_i915.so
    vk-icds = intel_icd.json
    vk-exps = /usr/lib/graphics/vulkansc/VkSCLayer_khronos_validation.json
  end egl display

  begin wfd device 1
    wfd-dlls = libwfdcfg-i915.so libWFDi915.so
    display-ids = 1, 2, 3, 4
  end wfd device

end khronos

begin winmgr

  begin globals
    default-display = 2
    stack-size = 262144  # in units of bytes
    blit-config = gles2blt
    alloc-config = alloc-i915
    requests-logsize = 65536
    blits-logsize = 4096
  end globals

  begin display 1
    video-mode = 1920 x 1080 @ 60
    force-composition = true
    stack-size = 262144  # in units of bytes
    defer-framebuffer-creation = false
  end display

  begin display 2
    video-mode = 1920 x 1080 @ 60
    force-composition = true
    stack-size = 262144  # in units of bytes
    defer-framebuffer-creation = false
  end display

  begin display 3
    video-mode = 1920 x 1080 @ 60
    force-composition = true
    stack-size = 262144  # in units of bytes
    defer-framebuffer-creation = false
  end display

  begin display 4
    video-mode = 1920 x 1080 @ 60
    force-composition = true
    stack-size = 262144  # in units of bytes
    defer-framebuffer-creation = false
  end display

  begin class framebuffer-1
    display = 1
    pipeline = 100
    format = rgba8888
    usage = gles2blt
  end class

  begin class framebuffer-2
    display = 2
    pipeline = 200
    format = rgba8888
    usage = gles2blt
  end class

  begin class framebuffer-3
    display = 3
    pipeline = 300
    format = rgba8888
    usage = gles2blt
  end class

  begin class framebuffer-4
    display = 4
    pipeline = 400
    format = rgba8888
    usage = gles2blt
  end class

end winmgr
