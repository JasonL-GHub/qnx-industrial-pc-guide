begin khronos

  begin egl display 1
    egl-dlls = libglapi-mesa.so libEGL-mesa.so
    glesv2-dlls = libglapi-mesa.so libGLESv2-mesa.so
    gpu-dlls = gpu_drm.so
    vk-icds = intel_icd.json
    # vk-imps = /usr/lib/graphics/vulkan/VkLayer_MESA_overlay.json
    vk-exps = /usr/lib/graphics/vulkan/VkLayer_khronos_validation.json
  end egl display

  begin wfd device 1
    wfd-dlls = libwfdcfg-intel-generic.so libWFDintel-drm.so

    # Run "drm-probe-displays" to list the available displays and pipelines,
    # and "use $GRAPHICS_ROOT/libWFDintel-drm.so" for more information on
    # these driver-specific settings.

    # Here is displays map for Intel NUC 6i5SYH:
    # display 1: HDMI-A
    # display 2: DisplayPort
    # display 3: HDMI-A

    # Pipeline IDs 1 to 9 are used for DRM CRTCs.  One should be assigned
    # to each display that will be used.
    pipeline1-display = 1
    pipeline2-display = 2
    pipeline3-display = 3

    # if underlying driver supports, set "Broadcast RGB" property of DRM
    # connector to: auto, full or limited. Full for full RGB range 0:255,
    # limited is for limited RGB range 16:235.

    # begin wfd port 1
    #   broadcast-rgb = auto
    # end wfd port
    #
    # begin wfd port 2
    #   broadcast-rgb = auto
    # end wfd port
  end wfd device

end khronos

begin winmgr

  begin globals
    default-display = 2
    stack-size = 65536  # in units of bytes
    blit-config = inteldrm
    alloc-config = inteldrm
    requests-logsize = 65536
    blits-logsize = 4096
  end globals

  begin display 1
    video-mode = 1920 x 1080 @ 60
    stack-size = 65536  # in units of bytes
  end display

  begin display 2
    video-mode = 1920 x 1080 @ 60
    stack-size = 65536  # in units of bytes
  end display

  begin display 3
    video-mode = 1920 x 1080 @ 60
    stack-size = 65536  # in units of bytes
  end display

  begin class framebuffer-1
    display = 1
    pipeline = 1
    format = rgba8888
    usage = inteldrm
  end class

  begin class framebuffer-2
    display = 2
    pipeline = 2
    format = rgba8888
    usage = inteldrm
  end class

  begin class framebuffer-3
    display = 3
    pipeline = 3
    format = rgba8888
    usage = inteldrm
  end class

end winmgr